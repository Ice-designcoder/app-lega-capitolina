<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lega Capitolina</title>
    <!-- Font eleganti e icone -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Colleghiamo il nostro file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- L'intestazione fissa in alto -->
    <header class="app-header">
        <h1>Lega Capitolina</h1>
    </header>

    <!-- Il contenitore dove cambieranno le schermate -->
    <main class="app-content">
        
        <!-- Schermata 1: HOME -->
        <section id="home" class="tab-content active">
            <h2>Prossimo Turno</h2>
            <div class="card-grafica">
                <!-- Se hai chiamato la grafica diversamente da fixtures.jpg, cambialo qui -->
                <img src="img/fixtures.jpg" alt="Fixtures Giornata" class="grafica-img">
            </div>
        </section>

        <!-- Schermata 2: RISULTATI -->
        <section id="risultati" class="tab-content">
            <!-- La nuova tendina per selezionare le giornate -->
            <div class="matchday-header">
                <select id="giornata-selector" onchange="filtraGiornata()">
                    <!-- Le opzioni delle giornate verranno caricate in automatico da app.js -->
                </select>
            </div>
            
            <!-- Il contenitore delle partite -->
            <div class="match-list">
                <!-- Le partite verranno caricate qui in automatico da app.js leggendo Google Sheets -->
            </div>
        </section>

        <!-- Schermata 3: CLASSIFICA -->
        <section id="classifica" class="tab-content">
            <div class="matchday-header">Classifica Generale</div>
            
            <div class="standings-container">
                <!-- La classifica verrà caricata qui in automatico da app.js leggendo Google Sheets -->
            </div>
        </section>

        <!-- Schermata 4: STATISTICHE -->
        <section id="statistiche" class="tab-content">
            <div class="matchday-header">Statistiche Lega</div>
            
            <!-- Il nuovo contenitore a griglia per le card -->
            <div id="stats-container" class="stats-grid">
                <!-- Le varie classifiche verranno caricate qui in automatico -->
            </div>
        </section>

    </main>

    <!-- La barra di navigazione fissa in basso -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="cambiaTab('home', this)">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>
        <button class="nav-btn" onclick="cambiaTab('risultati', this)">
            <i class="fa-solid fa-futbol"></i>
            <span>Risultati</span>
        </button>
        <button class="nav-btn" onclick="cambiaTab('classifica', this)">
            <i class="fa-solid fa-list-ol"></i>
            <span>Classifica</span>
        </button>
        <button class="nav-btn" onclick="cambiaTab('statistiche', this)">
            <i class="fa-solid fa-chart-simple"></i>
            <span>Stats</span>
        </button>
    </nav>

    <!-- MODALE: La finestra a comparsa per i dettagli della partita -->
    <div id="match-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="chiudiModale()">&times;</span>
            <h3 id="modal-title" style="text-align:center; font-family:'Cinzel', serif; color:#1a1a24;">Dettagli Partita</h3>
            
            <!-- Punteggi Fantacalcio in grande -->
            <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1.8rem; margin: 15px 0; color:#8b0000; padding: 0 20px;">
                <span id="modal-pt-casa">0.0</span>
                <span id="modal-pt-trasf">0.0</span>
            </div>
            
            <!-- Contenitore Eventi (Gol, assist, cartellini) -->
            <div class="formazioni-container">
                <div class="formazione-casa" id="modal-eventi-casa" style="flex:1; text-align:left; border-right:1px solid #eee; padding-right:10px;">
                    <!-- Eventi casa inseriti da app.js -->
                </div>
                <div class="formazione-trasferta" id="modal-eventi-trasf" style="flex:1; text-align:right; padding-left:10px;">
                    <!-- Eventi trasferta inseriti da app.js -->
                </div>
            </div>
        </div>
    </div>

    <!-- Colleghiamo il file JavaScript -->
    <script src="app.js?v=1000"></script>
</body>
</html>
